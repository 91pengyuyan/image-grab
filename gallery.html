<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>图提取 - 图片预览</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <header class="g-header">
    <div class="g-title">
      <span class="g-logo">🖼️</span>
      <h1 id="pageTitle">商品图片</h1>
      <span class="g-count">共 <b id="totalCount">0</b> 张</span>
    </div>
    <div class="g-toolbar">
      <button id="btnSelectAll" class="g-btn">全选</button>
      <button id="btnInvert" class="g-btn">反选</button>
      <span class="g-selected">已选 <b id="selectedCount">0</b> 张</span>
      <button id="btnDownload" class="g-btn g-btn-primary">下载选中</button>
    </div>
  </header>

  <div id="statusBar" class="g-status">准备就绪</div>

  <main id="galleryGrid" class="g-grid"></main>

  <script src="gallery.js"></script>
</body>
</html>
